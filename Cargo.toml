[package]
name = "router-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal control for an Olax MC60 (Realtek SDK) 4G LTE router web UI"
repository = "https://github.com/alhasapi/router-cli"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
